<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Commerce UI Kit</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="navbar.css">
  <link rel="stylesheet" href="search.css">
  <link rel="stylesheet" href="cart.css">
</head>
<body>
  <header class="navbar">
    <a class="logo" href="#">🛍️ UI Kit Shop</a>
    <nav class="nav-links">
      <a href="#">Home</a>
      <a href="#products">Products</a>
      <a href="#contact">Contact</a>
    </nav>
    <button id="cart-btn" class="cart-btn" aria-label="Open cart">🛒 <span id="cart-count">0</span></button>
  </header>

  <section class="hero">
    <h1>Find your next favourite thing</h1>
    <p>Simple, clean UI kit for an online shop.</p>
  </section>

  <div class="search-bar" id="products">
    <input id="search" type="search" placeholder="Search products...">
  </div>

  <main id="app"></main>

  <footer id="contact" class="footer">
    <p>© 2026 UI Kit Shop · Git Workflow practice project</p>
  </footer>

  <aside id="cart-panel" class="cart-panel hidden">
    <div class="cart-header">
      <h2>Your Cart</h2>
      <button id="close-cart" aria-label="Close cart">✕</button>
    </div>
    <ul id="cart-items"></ul>
    <p class="cart-total">Total: <span id="cart-total">$0.00</span></p>
    <button id="clear-cart">Clear cart</button>
  </aside>

  <script src="app.js"></script>
  <script src="search.js"></script>
  <script src="cart.js"></script>
</body>
</html>
