<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Commerce UI Kit</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="navbar.css">
  <link rel="stylesheet" href="search.css">
</head>
<body>
  <header class="navbar">
    <a class="logo" href="#">🛍️ UI Kit Shop</a>
    <nav class="nav-links">
      <a href="#">Home</a>
      <a href="#products">Products</a>
      <a href="#contact">Contact</a>
    </nav>
    <button id="cart-btn" class="cart-btn" aria-label="Open cart">🛒 <span id="cart-count">0</span></button>
  </header>

  <div class="search-bar">
    <input id="search" type="search" placeholder="Search products...">
  </div>

  <main id="app"></main>

  <script src="app.js"></script>
  <script src="search.js"></script>
</body>
</html>
